<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brushkeep responsive review</title><style>body{margin:0;background:#10181b;color:#dde5dd;font:12px system-ui}nav{padding:12px}button{padding:6px 14px;margin-right:6px}iframe{display:block;border:0;width:390px;height:1800px}p{margin:10px 0}</style><nav><button data-width="390">390px</button><button data-width="320">320px</button><button data-width="500">500px</button><p id="metrics">Loading…</p></nav><iframe id="app" src="../?responsive-review=1" title="Brushkeep narrow viewport"></iframe><script>
const frame=document.getElementById('app');function measure(){const d=frame.contentDocument;frame.style.height=Math.ceil(d.body.getBoundingClientRect().height)+'px';document.getElementById('metrics').textContent=`Viewport ${d.documentElement.clientWidth}px · document ${d.documentElement.scrollWidth}px · horizontal overflow ${Math.max(0,d.documentElement.scrollWidth-d.documentElement.clientWidth)}px`;}frame.onload=()=>{measure();new ResizeObserver(measure).observe(frame.contentDocument.body);};document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';requestAnimationFrame(measure);});
</script></html>
